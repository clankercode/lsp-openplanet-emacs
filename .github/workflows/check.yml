name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  emacs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.4', '30.2', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - run: make check
      - run: make install-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global openplanet-lsp@0.8.0
      - run: make integration
      - name: Test optional lsp-mode client
        env:
          OPENPLANET_PACKAGE_DIR: ${{ runner.temp }}/openplanet-packages
        run: |
          emacs -Q --batch --eval '(progn
            (require (quote package))
            (setq package-user-dir (getenv "OPENPLANET_PACKAGE_DIR")
                  package-archives (quote (("gnu" . "https://elpa.gnu.org/packages/")
                                           ("melpa" . "https://melpa.org/packages/"))))
            (package-initialize)
            (package-refresh-contents)
            (package-install (quote lsp-mode)))'
          make lsp-test lsp-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eglot-events-${{ matrix.emacs_version }}
          path: |
            /tmp/openplanet-eglot-events.log
            /tmp/openplanet-lsp-mode-events.log
